<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Neon Pong</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-wrapper">
    <canvas id="game-canvas"></canvas>

    <div id="crt-overlay">
      <div class="scanlines"></div>
      <div class="vignette"></div>
    </div>

    <div id="menu-screen" class="screen active">
      <div class="menu-container glass">
        <h1 class="neon-title">NEON PONG</h1>
        <div class="menu-buttons">
          <button class="neon-btn" data-mode="ai" data-difficulty="easy">
            <span class="btn-label">1 PLAYER</span>
            <span class="btn-sub">EASY</span>
          </button>
          <button class="neon-btn" data-mode="ai" data-difficulty="normal">
            <span class="btn-label">1 PLAYER</span>
            <span class="btn-sub">NORMAL</span>
          </button>
          <button class="neon-btn" data-mode="ai" data-difficulty="hard">
            <span class="btn-label">1 PLAYER</span>
            <span class="btn-sub">HARD</span>
          </button>
          <button class="neon-btn" data-mode="2p">
            <span class="btn-label">2 PLAYERS</span>
            <span class="btn-sub">LOCAL</span>
          </button>
        </div>
        <div class="controls-panel">
          <div class="control-row">
            <span class="key-badge cyan">W</span>
            <span class="key-badge cyan">S</span>
            <span class="control-text">P1 Move</span>
            <span class="control-divider">|</span>
            <span class="key-badge magenta">↑</span>
            <span class="key-badge magenta">↓</span>
            <span class="control-text">P2 Move</span>
          </div>
          <div class="control-row">
            <span class="key-badge yellow">P</span>
            <span class="key-badge yellow">Esc</span>
            <span class="control-text">Pause</span>
            <span class="control-divider">|</span>
            <span class="control-text">Mouse / Touch also works</span>
          </div>
        </div>
        <div class="save-panel">
          <div id="save-stats" class="save-stats">Save file: 0 games | P1 record 0-0</div>
          <ol id="leaderboard-list" class="leaderboard-list">
            <li>No saved wins yet</li>
          </ol>
        </div>
        <div class="menu-footer">
          <button id="settings-btn" class="icon-btn" title="Settings">⚙</button>
          <button id="mute-btn" class="icon-btn" title="Toggle Audio">🔊</button>
        </div>
      </div>
    </div>

    <div id="hud" class="screen">
      <div class="score-board">
        <div class="score" id="score-p1">0</div>
        <div class="score-divider">|</div>
        <div class="score" id="score-p2">0</div>
      </div>
      <div class="hud-info">
        <span id="mode-label">VS AI</span>
        <button id="hud-mute-btn" class="icon-btn">🔊</button>
        <button id="pause-btn" class="icon-btn">⏸</button>
      </div>
      <div id="effect-strip" class="effect-strip"></div>
      <div id="controls-hint" class="controls-hint">
        <div class="hint-row">
          <span class="key-badge cyan">W</span>
          <span class="key-badge cyan">S</span>
          <span class="hint-text">P1</span>
        </div>
        <div class="hint-row" id="hint-p2">
          <span class="key-badge magenta">↑</span>
          <span class="key-badge magenta">↓</span>
          <span class="hint-text">P2</span>
        </div>
      </div>
    </div>

    <div id="pause-screen" class="screen">
      <div class="menu-container glass">
        <h2 class="neon-title small">PAUSED</h2>
        <div class="menu-buttons">
          <button id="resume-btn" class="neon-btn">RESUME</button>
          <button id="quit-btn" class="neon-btn">QUIT TO MENU</button>
        </div>
        <div class="controls-reminder">
          <div class="control-row small">
            <span class="key-badge cyan">W</span>
            <span class="key-badge cyan">S</span>
            <span class="control-text">P1</span>
            <span class="control-divider">|</span>
            <span class="key-badge magenta">↑</span>
            <span class="key-badge magenta">↓</span>
            <span class="control-text">P2</span>
            <span class="control-divider">|</span>
            <span class="key-badge yellow">P</span>
            <span class="control-text">Pause</span>
          </div>
        </div>
      </div>
    </div>

    <div id="gameover-screen" class="screen">
      <div class="menu-container glass">
        <h2 class="neon-title small" id="winner-text">PLAYER 1 WINS</h2>
        <div class="final-score">
          <span id="final-p1">0</span> — <span id="final-p2">0</span>
        </div>
        <div class="save-panel compact">
          <div id="gameover-save-stats" class="save-stats">Save file: 0 games | P1 record 0-0</div>
          <ol id="gameover-leaderboard" class="leaderboard-list">
            <li>No saved wins yet</li>
          </ol>
        </div>
        <div class="menu-buttons">
          <button id="restart-btn" class="neon-btn">PLAY AGAIN</button>
          <button id="menu-btn" class="neon-btn">MAIN MENU</button>
        </div>
      </div>
    </div>

    <div id="settings-screen" class="screen">
      <div class="menu-container glass settings-container">
        <h2 class="neon-title small">SETTINGS</h2>
        <div class="settings-rows">
          <div class="setting-row">
            <label class="setting-label">Music</label>
            <input type="range" id="music-volume" class="neon-slider" min="0" max="1" step="0.05" value="0.7" />
            <span id="music-volume-label" class="setting-value">70%</span>
          </div>
          <div class="setting-row">
            <label class="setting-label">SFX</label>
            <input type="range" id="sfx-volume" class="neon-slider" min="0" max="1" step="0.05" value="0.7" />
            <span id="sfx-volume-label" class="setting-value">70%</span>
          </div>
          <div class="setting-row">
            <label class="setting-label">CRT Overlay</label>
            <button id="crt-toggle" class="toggle-btn on">ON</button>
          </div>
          <div class="setting-row">
            <label class="setting-label">Particles</label>
            <button id="particles-toggle" class="toggle-btn on">ON</button>
          </div>
        </div>
        <div class="menu-buttons">
          <button id="settings-back-btn" class="neon-btn">BACK</button>
        </div>
      </div>
    </div>

    <div id="touch-zones">
      <div id="touch-left" class="touch-zone"></div>
      <div id="touch-right" class="touch-zone"></div>
    </div>
  </div>

  <!-- Configuration constants -->
   <script src="lib/config.js"></script>
   <!-- Engine core: state, save, shared utilities -->
   <script src="lib/state.js"></script>
   <script src="lib/engine.js"></script>
  <!-- Procedural audio -->
  <script src="lib/audio.js"></script>
  <!-- Power-ups, entities, particles, trails -->
  <script src="lib/powerups.js"></script>
  <script src="lib/powerup.js"></script>
  <!-- Canvas rendering -->
  <script src="lib/render.js"></script>
  <!-- Game logic, AI, input, screens, loop -->
  <script src="lib/logic.js"></script>
  <!-- DOM binding, event listeners, init -->
  <script src="main.js"></script>
</body>
</html>
